<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Water – Naval Simulation (3D w/ 2D Fallback)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#050b1e;color:#eaeaea;font-family:system-ui,Arial,sans-serif}
#ui{position:absolute;top:0;left:0;right:0;padding:8px;text-align:center;background:rgba(10,20,40,.8);z-index:10}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.85;z-index:10}
#status{position:absolute;top:48px;left:10px;font-size:12px;opacity:.9;z-index:10}
canvas{display:block}
</style>
</head>
<body>
<div id="ui"><strong>WATER</strong> – Naval Simulation (3D if available, 2D fallback)</div>
<div id="hint">WASD = steer · Mouse = camera (3D) · Click = fire</div>
<div id="status">Loading engine…</div>
<canvas id="fallback2d"></canvas>

<!-- Attempt 3D engine (may be blocked in sandbox) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>

<script>
// =====================
// BOOTSTRAP
// =====================
(function boot(){
  const status = document.getElementById('status');
  if (typeof window.THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
    status.textContent = '3D blocked – running 2D fallback';
    start2DFallback();
  } else {
    status.textContent = '3D ready';
    start3D();
  }
})();

// =====================
// 2D FALLBACK (NO EXTERNAL LIBS)
// =====================
function start2DFallback(){
  const canvas = document.getElementById('fallback2d');
  const ctx = canvas.getContext('2d');
  function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
  resize(); addEventListener('resize',resize);

  let t=0;
  const ship={x:innerWidth/2,y:innerHeight/2,dir:0,v:0};
  const ai={x:innerWidth/2+200,y:innerHeight/2,dir:Math.PI,v:0};
  const keys={};
  addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

  function drawWater(){
    ctx.fillStyle='#0a3d62'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#4cc9f0'; ctx.beginPath();
    for(let x=0;x<canvas.width;x+=10){
      const y=canvas.height/2+Math.sin(x*0.02+t)*20;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  function drawShip(s,color){
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.dir);
    ctx.fillStyle=color; ctx.fillRect(-15,-5,30,10);
    ctx.restore();
  }

  function update(){
    requestAnimationFrame(update); t+=0.03;
    if(keys.w) ship.v+=0.2; if(keys.s) ship.v-=0.2;
    if(keys.a) ship.dir-=0.05; if(keys.d) ship.dir+=0.05;
    ship.v*=0.95;
    ship.x+=Math.cos(ship.dir)*ship.v;
    ship.y+=Math.sin(ship.dir)*ship.v;

    drawWater();
    drawShip(ship,'#4cc9f0');
    drawShip(ai,'#ff595e');
  }
  update();
}

// =====================
// 3D VERSION (UNCHANGED LOGIC)
// =====================
function start3D(){
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x050b1e, 60, 500);

  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
  camera.position.set(0, 40, 80);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true;

  scene.add(new THREE.AmbientLight(0x8899aa,0.5));
  const sun=new THREE.DirectionalLight(0xffffff,1.2);
  sun.position.set(100,150,80); scene.add(sun);

  const oceanGeo=new THREE.PlaneGeometry(1000,1000,200,200);
  const oceanMat=new THREE.MeshStandardMaterial({color:0x0a3d62,roughness:0.35,metalness:0.4,side:THREE.DoubleSide});
  const ocean=new THREE.Mesh(oceanGeo,oceanMat);
  ocean.rotation.x=-Math.PI/2; scene.add(ocean);
  let t=0;

  function animate(){
    requestAnimationFrame(animate); t+=0.03;
    const pos=ocean.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i),y=pos.getY(i);
      pos.setZ(i,Math.sin(x*0.04+t)+Math.sin(y*0.05+t*1.2));
    }
    pos.needsUpdate=true; ocean.geometry.computeVertexNormals();
    controls.update(); renderer.render(scene,camera);
  }
  animate();
}
</script>
</body>
</html>
